[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lora-from-scratch"
version = "1.0.0"
description = "LoRA (Low-Rank Adaptation) implemented from scratch in PyTorch — no peft library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "SWAYAM109"}]
keywords = ["lora", "fine-tuning", "llm", "parameter-efficient", "pytorch", "qlora"]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/SWAYAM109/lora-from-scratch"
